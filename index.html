<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />

    <!-- Fonts: Space Grotesk (display/headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary Meta -->
    <title>Deepak Gautam | Data Engineer — Loyalty Systems & AI</title>
    <meta name="title" content="Deepak Gautam | Data Engineer — Loyalty Systems & AI" />
    <meta
      name="description"
      content="Data Engineer at Americana Restaurants (KFC, Pizza Hut, Hardee's). Building the Peet's Coffee Loyalty Platform for 50K+ daily users. NIT Kurukshetra. LeetCode Knight · CodeChef 4★."
    />
    <meta
      name="keywords"
      content="Deepak Gautam, Data Engineer, Americana Restaurants, Peet's Coffee, Loyalty Platform, RAG Pipeline, AI Developer, NIT Kurukshetra, React, Azure, C#, Full Stack"
    />
    <meta name="author" content="Deepak Gautam" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://portfolio-react-nine-orpin.vercel.app/" />

    <!-- Open Graph / LinkedIn / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portfolio-react-nine-orpin.vercel.app/" />
    <meta property="og:title" content="Deepak Gautam | Data Engineer — Loyalty Systems & AI" />
    <meta
      property="og:description"
      content="Building production systems at Americana Restaurants. Peet's Coffee Loyalty Platform · 50K+ daily users · RAG pipelines · LeetCode Knight · CodeChef 4★."
    />
    <meta
      property="og:image"
      content="https://portfolio-react-nine-orpin.vercel.app/images/og-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Deepak Gautam Portfolio" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://portfolio-react-nine-orpin.vercel.app/" />
    <meta name="twitter:title" content="Deepak Gautam | Data Engineer — Loyalty Systems & AI" />

      name="twitter:description"
      content="Building production systems at Americana Restaurants · Peet's Coffee Loyalty Platform · 50K+ DAU · RAG pipelines · LeetCode Knight."
    />
    <meta
      name="twitter:image"
      content="https://portfolio-react-nine-orpin.vercel.app/images/og-preview.png"

    <!-- Preload critical above-fold image — tells browser to fetch ASAP before JS runs -->
    <link rel="preload" href="/images/ProfilePic.png" as="image" fetchpriority="high" />

    <!-- Preconnect for external APIs we fetch on load -->
    <link rel="preconnect" href="https://api.github.com" />

    <!-- Structured data for search engines / rich results -->

        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Deepak Gautam",
        "jobTitle": "Data Engineer",
